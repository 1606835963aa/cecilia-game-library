<!doctype html>
<html lang="zh-CN" data-theme="__THEME__" data-frame="__FRAME__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="token" content="__TOKEN__">
  <title>塞西莉亚的游戏库</title>
  <link rel="icon" href="/web/icon.ico">
  <link rel="stylesheet" href="/web/style.css">
  <link rel="stylesheet" href="/web/theme-paper.css">
</head>
<body>
  <header class="topnav">
    <a class="brand" href="#/">
      <img src="/web/icon.ico" alt="">
      <svg class="brand-flower" viewBox="100 90 1054 1054" aria-hidden="true">
        <path fill="#24735D" d="M628 982C570 901 379 913 294 727L493 772C382 662 281 517 175 477C282 416 413 433 507 494C516 376 576 293 694 254C758 231 804 266 792 310C773 276 731 290 729 323C718 372 753 425 749 488C851 426 966 412 1079 477C970 516 869 655 764 770L963 726C900 877 710 895 628 982Z"/>
        <path fill="#F4F8EF" d="M636 801C602 686 569 586 538 514C540 394 596 307 704 274C738 263 767 269 775 287C738 274 704 299 704 338C704 389 738 438 735 497C727 597 677 726 636 801Z"/>
        <path fill="#F4F8EF" d="M610 815C586 672 552 573 495 510C414 460 311 427 216 465C331 518 330 603 415 674C486 726 550 757 610 815Z"/>
        <path fill="#F4F8EF" d="M650 815C677 663 723 570 765 512C857 455 950 437 1034 470C920 516 902 609 817 675C747 727 706 757 650 815Z"/>
        <path fill="#87B6A0" d="M607 926C530 870 391 862 330 751C464 770 560 816 607 926Z"/>
        <path fill="#87B6A0" d="M650 925C719 867 861 855 927 751C801 773 706 817 650 925Z"/>
        <circle fill="#D9939B" cx="636" cy="621" r="29"/>
      </svg>
      <span>塞西莉亚的游戏库</span>
    </a>
    <nav class="nav-links">
      <a href="#/" data-nav="home">主页</a>
      <a href="#/settings" data-nav="settings">设置</a>
    </nav>
    <button id="now-playing" class="now-playing" hidden></button>
    <div class="nav-right">
      <span id="summary" class="summary"></span>
      <button id="scan" class="nav-btn" title="立刻扫描 games 文件夹，并重新统计占用空间">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
        <span>扫描</span>
      </button>
    </div>
    <div class="win-ctrls">
      <button data-win="min" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5h8"/></svg>
      </button>
      <button data-win="max" title="最大化" aria-label="最大化">
        <svg class="ic-max" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1"/></svg>
        <svg class="ic-restore" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="4" width="6" height="6" rx="1"/><path d="M4.5 2h4.5a1 1 0 0 1 1 1v4.5"/></svg>
      </button>
      <button data-win="close" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-tools">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="搜索（按 / 键）" autocomplete="off">
        </label>
        <select id="platform" aria-label="平台">
          <option value="全部">全部平台</option>
          <option value="PC">PC</option>
          <option value="安卓">安卓</option>
        </select>
      </div>
      <nav id="side-list" class="side-list" aria-label="游戏列表"></nav>
      <div class="side-foot">
        <div id="import-menu" class="import-menu" role="menu" hidden>
          <button role="menuitem" data-import-pick="archives">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8"/><path d="M1 3h22v5H1zM10 12h4"/></svg>
            <span>选择压缩包<small>解压进 games 文件夹，分卷选第一份就行</small></span>
          </button>
          <button role="menuitem" data-import-pick="folder">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
            <span>选择游戏文件夹<small>已经解压好、能直接玩的游戏</small></span>
          </button>
          <p>也可以把文件夹、压缩包直接拖进窗口</p>
        </div>
        <button id="import-btn" class="import-btn" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>导入游戏</span>
        </button>
      </div>
    </aside>

    <main id="view" class="view"></main>
  </div>

  <div id="ctx" class="ctx" role="menu" hidden></div>
  <input type="file" id="image-file" accept="image/*" hidden>
  <div id="toast" class="toast" role="status"></div>
  <div id="drop-overlay" class="drop-overlay" hidden>
    <div class="drop-card">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <b>松手导入游戏</b>
      <span>游戏文件夹、压缩包、游戏的 exe 都可以</span>
    </div>
  </div>

  <dialog id="confirm" class="dialog">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="dialog-btns">
        <button value="cancel" class="btn">取消</button>
        <button value="ok" id="confirm-ok" class="btn btn-confirm"></button>
      </div>
    </form>
  </dialog>

  <dialog id="match" class="dialog dialog-wide">
    <div class="match-head">
      <h2>匹配资料</h2>
      <p>在 Steam、VNDB、DLsite、itch.io 上搜这个游戏，选中正确的那个，封面、横幅、简介和截图会一起换上。知道它在哪儿卖的话，直接粘贴商店页面链接最准，DLsite 的游戏也可以只填作品编号（RJ、VJ 等字母开头的那串）。</p>
      <form id="match-form" class="match-search">
        <label class="search big">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="match-q" type="text" placeholder="输入游戏名，或粘贴商店页面链接" autocomplete="off">
        </label>
        <button class="btn btn-primary">搜索</button>
      </form>
    </div>
    <div id="match-results" class="match-results"></div>
    <div class="dialog-btns match-foot">
      <span class="hint">搜不到也没关系，可以在游戏页面右边「外观」里自己换封面和背景。</span>
      <button class="btn" data-close>关闭</button>
    </div>
  </dialog>

  <dialog id="import" class="dialog dialog-wide import-dialog" autofocus>
    <div class="import-head">
      <h2 id="import-title">导入游戏</h2>
      <p id="import-sub"></p>
    </div>
    <div id="import-list" class="import-list"></div>
    <div id="import-opts" class="import-opts"></div>
    <div class="dialog-btns import-foot">
      <span id="import-hint" class="hint"></span>
      <button class="btn" id="import-cancel" data-close>取消</button>
      <button class="btn btn-primary" id="import-go">导入</button>
    </div>
  </dialog>

  <dialog id="viewer" class="viewer">
    <img id="viewer-img" alt="">
    <button class="viewer-nav prev" data-step="-1" aria-label="上一张"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="viewer-nav next" data-step="1" aria-label="下一张"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
    <button class="viewer-close" data-close aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div id="viewer-count" class="viewer-count"></div>
  </dialog>

  <script src="/web/app.js"></script>
</body>
</html>
